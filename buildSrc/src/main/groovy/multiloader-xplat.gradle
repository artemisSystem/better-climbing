def repo(r, String repoURL, String... groups) {
	r.maven {
		url = repoURL
		content {
			for (group in groups) { includeGroup group }
		}
	}
}

plugins {
	id "java"
	id "java-library"
	id "idea"
	id "maven-publish"
	id "com.diffplug.spotless"
}

// TODO: set archivesBaseName here?

java {
	toolchain.languageVersion = JavaLanguageVersion.of(java_version)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21 // TODO: template as int somehow?
}

tasks.withType(GenerateModuleMetadata) {
	enabled = false
}

repositories {
	mavenCentral()
	repo it, "https://repo.spongepowered.org/repository/maven-public", "org.spongepowered" // TODO: We need some subgroups here
	repo it, "https://maven.parchmentmc.org", "org.parchmentmc.data"
	repo it, "https://maven.neoforged.net/releases", "org.parchmentmc.data" // Backup
	repo it, "https://maven.blamejared.com" // TODO: find out what groups we use
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
["apiElements", "runtimeElements", "sourcesElements"].each { variant ->
	configurations."$variant".outgoing {
		capability("$group:${base.archivesName.get()}:$version")
		capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
		capability("$group:$mod_id:$version")
	}
	publishing.publications.configureEach {
		suppressPomMetadataWarningsFor(variant)
	}
}

sourcesJar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${mod_name}" }
	}
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${mod_name}" }
	}

	manifest {
		attributes([
				"Specification-Title": project.mod_name,
				"Specification-Vendor": project.mod_author,
				"Specification-Version": project.jar.archiveVersion,
				"Implementation-Title": project.name,
				"Implementation-Version": project.jar.archiveVersion,
				"Implementation-Vendor": project.mod_author,
				"Built-On-Minecraft": project.minecraft_version
		])
	}
}

tasks.withType(ProcessResources).configureEach {
	def expandProps = [
		"group"                        : project.group,
		"license"                      : project.license,

		"minecraft_version"            : project.minecraft_version,
		"neoforge_version"             : project.neoforge_version,
		"fabric_loader_version"        : project.fabric_loader_version,

		"mod_name"                     : project.mod_name,
		"mod_id"                       : project.mod_id,
		"mod_version"                  : project.mod_version,
		"mod_author"                   : project.mod_author,
		"mod_description"              : project.mod_description,

		"mixin_min_version"            : project.mixin_min_version
	]

	filesMatching(["pack.mcmeta", "fabric.mod.json", "META-INF/neoforge.mods.toml", "*mixins.json"]) {
		expand expandProps
	}
	inputs.properties(expandProps)
}

spotless {
	enforceCheck = false
	java {
		removeUnusedImports()
		importOrder()
		indentWithTabs()
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId base.archivesName.get()
			from components.java
		}
	}
	repositories {
		maven {
			url System.getenv("local_maven_url")
		}
	}
}
